name: Jarvis

on:
  push:
    branches: [main]
    paths: ['jarvis/**', '.github/workflows/jarvis.yml']
  pull_request:
    paths: ['jarvis/**', '.github/workflows/jarvis.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis/package-lock.json
      - run: npm ci
      - run: npm run check
      # Las fechas no pueden depender de la zona horaria de la máquina.
      - run: npm test
        env:
          TZ: Pacific/Auckland
